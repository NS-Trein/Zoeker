<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><title>Beheer</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--kaart:#fff;--tekst:#1b1d22;--zacht:#5b6270;--rand:#c9ced8;--blauw:#0063d3;--goed:#1a7a43;--fout:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#000;--kaart:#1c1c1e;--tekst:#f2f2f5;--zacht:#a0a6b3;--rand:#3a3d45;--blauw:#6aa7ff;--goed:#5fd58b;--fout:#ff8a80}}
*{box-sizing:border-box}body{margin:0;padding:max(16px,env(safe-area-inset-top)) 16px 40px;background:var(--bg);color:var(--tekst);font:17px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto}h1{font-size:24px;margin:8px 0 4px}h3{font-size:19px;margin:28px 0 8px}p{margin:6px 0}
.kaart{background:var(--kaart);border:1px solid var(--rand);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;min-height:48px;border-radius:12px;border:2px solid var(--blauw);background:transparent;color:var(--blauw);padding:0 16px;width:100%;margin-top:8px;font-weight:600}
button.knop{background:var(--blauw);color:#fff}
input{font:inherit;width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--rand);background:var(--bg);color:var(--tekst);margin-top:4px}
label{display:block;margin-top:12px;font-size:15px;color:var(--zacht)}
.d-uitleg{font-size:15px;color:var(--zacht)}
.d-samen{padding:12px;border-radius:12px;font-weight:600;background:var(--bg)}.d-samen.goed{color:var(--goed)}.d-samen.slecht{color:var(--fout)}
.d-lijst{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.d-lijst li{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 12px;border-left:6px solid var(--rand)}
.d-lijst li.ok{border-color:var(--goed)}.d-lijst li.fout{border-color:var(--fout)}
.d-lijst img{width:40px;height:40px;border-radius:8px;flex:none}.d-lijst b{display:block}.d-lijst small{color:var(--zacht);word-break:break-all}
#d-status{margin:8px 0;font-weight:600}#d-status.ok{color:var(--goed)}#d-status.fout{color:var(--fout)}
#d-uit{margin:8px 0 0;padding:12px;background:#111;color:#eee;border-radius:12px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto}
</style></head>
<body><main>
<h1>Beheer</h1>
<p class="d-uitleg">Alleen voor de beheerder. Deze pagina staat niet in de app en is niet te vinden via een zoekmachine.</p>
<section id="slot" class="kaart">
  <label for="code">Beheercode</label>
  <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button type="button" class="knop" id="open">Openen</button>
  <p id="slot-fout" class="d-uitleg" style="color:var(--fout)"></p>
</section>
<section id="gereedschap" hidden>
<div class="diag">
    <h3>Web-app en iconen</h3>
    <div id="d-samen" class="d-samen">Wordt getest…</div>
    <ul id="d-lijst" class="d-lijst"></ul>
    <button type="button" class="knop" id="d-app">Test opnieuw</button>
    <button type="button" class="tekst" id="d-wis" style="width:100%;margin-top:8px">Wis de app-cache en begin schoon</button>
    <h3>NS-koppeling</h3>
    <p class="d-uitleg" id="d-worker"></p>
    <button type="button" class="tekst d-b" id="d-1">1. Treinen bij mij in de buurt</button>
    <label for="d-nr">Treinnummer (voor knop 2 en 3)</label>
    <input id="d-nr" inputmode="numeric" placeholder="bijv. 2150">
    <button type="button" class="tekst d-b" id="d-2">2. Haltes van deze rit</button>
    <button type="button" class="tekst d-b" id="d-3">3. Samenstelling van deze trein</button>
    <label for="d-st">Stationscode (voor knop 4)</label>
    <input id="d-st" value="UT" autocapitalize="characters" spellcheck="false">
    <button type="button" class="tekst d-b" id="d-4">4. Vertrektijden van dit station</button>
    <button type="button" class="tekst d-b" id="d-5">5. Ruwe treinlijst van NS</button>
    <button type="button" class="tekst d-b" id="d-6">6. Ruwe treinlijst met mijn plek (20 km)</button>
    <button type="button" class="tekst d-b" id="d-8">8. Geheugen van de Worker (hoe vaak NS gespaard is)</button>
    <button type="button" class="tekst d-b" id="d-7">7. Plaatje van NS ophalen (ddz_6.png)</button>
    <h3>Resultaat</h3>
    <div id="d-status"></div>
    <pre id="d-uit">Nog niets getest.</pre>
    <div id="d-plaat"></div>
    <button type="button" class="knop" id="d-kopieer">Kopieer resultaat</button>
  </div>

</section>
</main>
<script>
const WORKER_URL = "https://treinplek.cpqsws8cpg.workers.dev";
const $ = id => document.getElementById(id);
const h = (tag, props = {}, ...kinderen) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kinderen); return e; };
const fmt = x => x;
let SLEUTEL = "";
try { SLEUTEL = sessionStorage.getItem("beheer") || ""; } catch (_) {}
async function ontgrendel(code) {
  $("slot-fout").textContent = "";
  try {
    const r = await fetch(WORKER_URL + "/beheer", {headers: {"X-Beheer-Key": code}});
    if (!r.ok) { $("slot-fout").textContent = r.status === 403 ? "Die code klopt niet (of BEHEER_KEY staat nog niet in de Worker)." : "De Worker gaf fout " + r.status + "."; return false; }
  } catch (e) { $("slot-fout").textContent = "Geen verbinding met de Worker. Staat de nieuwste worker.js (v21) erin?"; return false; }
  SLEUTEL = code; try { sessionStorage.setItem("beheer", code); } catch (_) {}
  $("slot").hidden = true; $("gereedschap").hidden = false; dControleer(); return true;
}
$("open").onclick = () => ontgrendel($("code").value.trim());
$("code").addEventListener("keydown", e => { if (e.key === "Enter") $("open").click(); });
if (SLEUTEL) ontgrendel(SLEUTEL).then(ok => { if (!ok) { try { sessionStorage.removeItem("beheer"); } catch (_) {} } });
const D_UITLEG = {
  200: "Gelukt. De Worker en NS werken.",
  401: "NS weigert je sleutel (401). Controleer NS_KEY in Cloudflare en of je op het product Ns-App bent geabonneerd.",
  403: "Geweigerd (403): de beheercode klopt niet, of TOEGESTAAN in de Worker past niet bij dit adres.",
  404: "NS kent dit pad niet (404). Kopieer het resultaat en stuur het naar Claude.",
  429: "Te veel aanvragen (429). Wacht even en probeer opnieuw.",
  500.1: "De Worker mist je NS-sleutel. Zet NS_KEY als Secret in Cloudflare (Settings, Variables and Secrets) en klik op Deploy.",
  500: "NS gaf een interne fout (500). Onder het resultaat staat welke NS-paden de Worker probeerde. Kopieer het resultaat en stuur het naar Claude."
};
const dd = id => $("d-" + id);
function dToon(code, tekst) {
  dd("status").className = code === 200 ? "ok" : "fout";
  dd("status").textContent = D_UITLEG[code] || (code === 0 ? "Geen verbinding met de Worker." : `NS of de Worker gaf fout ${code}.`);
  dd("uit").textContent = tekst;
}
const dNr = () => dd("nr").value.replace(/\D/g, "");
async function dTest(naam, pad) {
  if (!WORKER_URL) return dToon(0, "Er is geen Worker ingesteld: dit is de testversie met nepdata.");
  dd("plaat").replaceChildren(); dd("status").textContent = ""; dd("uit").textContent = "Bezig…";
  try {
    const t0 = performance.now(), r = await fetch(WORKER_URL + pad, {headers: SLEUTEL ? {"X-Beheer-Key": SLEUTEL} : {}}), tekst = await r.text();
    let net = tekst; try { net = JSON.stringify(JSON.parse(tekst), null, 2); } catch (_) {}
    const nsPad = r.headers.get("x-ns-pad");
    let extra = "";
    if (pad.startsWith("/rit")) try { // drukte uit de rit samenvatten
      const stops = (JSON.parse(tekst).payload || {}).stops || [];
      extra = "Drukte per halte: " + (stops.map(x => ((x.departures || [])[0] || {}).crowdForecast ? `${x.stop && x.stop.name}=${x.departures[0].crowdForecast}` : null).filter(Boolean).join(", ") || "geen") + "\ncoachCrowdForecast (per bak): " + (stops.filter(x => (x.coachCrowdForecast || []).length).map(x => `${x.stop && x.stop.name}: ${x.coachCrowdForecast.length} items`).join(", ") || "leeg bij alle haltes") + "\n";
    } catch (_) {}
    dToon(/NS_KEY ontbreekt/.test(tekst) ? 500.1 : r.status, `${naam}\n${pad}\n${r.status} ${r.statusText} (${Math.round(performance.now() - t0)} ms)\n` + (nsPad ? `NS-pad dat werkte: ${nsPad}\n` : "") + extra + "\n" + net.slice(0, 6000) + (net.length > 6000 ? "\n…(ingekort)" : ""));
  } catch (e) { dToon(0, `${naam}\n${pad}\nGeen verbinding: ${e.message}\nControleer de Worker-URL en TOEGESTAAN in de Worker.`); }
}
function dMetPlek(naam, pad) { // pad bevat {lat} en {lng}
  const gebruik = (lat, lng, noot) => dTest(naam + noot, pad.replace("{lat}", lat.toFixed(5)).replace("{lng}", lng.toFixed(5)));
  if (!navigator.geolocation) return gebruik(52.0894, 5.1105, " (Utrecht, geen locatie beschikbaar)");
  navigator.geolocation.getCurrentPosition(p => gebruik(p.coords.latitude, p.coords.longitude, ""), () => gebruik(52.0894, 5.1105, " (Utrecht, locatie geweigerd)"), {timeout: 15000});
}
dd("worker").textContent = WORKER_URL ? "Worker: " + WORKER_URL : "Er is geen Worker ingesteld: dit is de testversie met nepdata.";
dd("1").onclick = () => dMetPlek("Treinen in de buurt", "/nabij?lat={lat}&lng={lng}&radius=5000&limit=10");
dd("2").onclick = () => dNr() ? dTest("Haltes van rit " + dNr(), `/rit?nummer=${dNr()}`) : dToon(0, "Vul eerst een treinnummer in.");
dd("3").onclick = () => dNr() ? dTest("Samenstelling van trein " + dNr(), `/trein?nummer=${dNr()}`) : dToon(0, "Vul eerst een treinnummer in.");
dd("4").onclick = () => dTest("Vertrektijden " + dd("st").value, `/vertrek?station=${encodeURIComponent(dd("st").value.trim().toUpperCase())}&maxJourneys=5`);
dd("5").onclick = () => dTest("Ruwe treinlijst van NS", "/ruw");
dd("8").onclick = () => dTest("Geheugen van de Worker", "/beheer");
dd("6").onclick = () => dMetPlek("Ruwe treinlijst met plek", "/ruw?lat={lat}&lng={lng}&radius=20000&limit=50");
dd("7").onclick = async () => {
  if (!WORKER_URL) return dToon(0, "Er is geen Worker ingesteld: dit is de testversie met nepdata.");
  dd("plaat").replaceChildren(); dd("status").textContent = ""; dd("uit").textContent = "Bezig…";
  try {
    const r = await fetch(`${WORKER_URL}/plaatje?url=${encodeURIComponent("https://vt.ns-mlab.nl/v1/images/ddz_6.png")}`);
    if (!r.ok) return dToon(r.status, `Plaatje van NS\n/plaatje\n${r.status} ${r.statusText}\n\n${(await r.text()).slice(0, 600)}\n\nStaat in Cloudflare de nieuwste worker.js (v17 of hoger)? Die laat ook vt.ns-mlab.nl toe.`);
    const blob = await r.blob(), u = URL.createObjectURL(blob), img = new Image();
    await new Promise((ok, fout) => { img.onload = ok; img.onerror = () => fout(new Error("Het antwoord is geen plaatje.")); img.src = u; });
    img.style.cssText = "max-width:100%;border:1px solid #c4cedb;border-radius:8px;background:#fff;margin-top:8px";
    dd("plaat").append(img);
    dToon(200, `Plaatje van NS\n/plaatje\n200 OK, ${blob.type}, ${Math.round(blob.size / 1024)} kB, ${img.naturalWidth} x ${img.naturalHeight} pixels\n(verwacht: 3215 x 108)`);
  } catch (e) { dToon(0, `Plaatje van NS\n/plaatje\nGeen verbinding of geen plaatje: ${e.message}`); }
};
dd("kopieer").onclick = async () => {
  try { await navigator.clipboard.writeText(dd("uit").textContent); dd("kopieer").textContent = "Gekopieerd!"; } catch (_) { dd("kopieer").textContent = "Kopiëren lukte niet, selecteer de tekst zelf"; }
  setTimeout(() => { dd("kopieer").textContent = "Kopieer resultaat"; }, 2500);
};
// Controle van de web-app en de iconen
async function dControleer() {
  const lijst = dd("lijst"); lijst.replaceChildren(); let fouten = 0;
  const rij = (ok, titel, tekst, img) => {
    if (ok === false) fouten++;
    const li = h("li", {className: ok === false ? "fout" : "ok"});
    if (img) li.append(h("img", {src: img, alt: ""}));
    li.append(h("div", {}, h("b", {textContent: (ok === false ? "❌ " : ok === true ? "✅ " : "ℹ️ ") + titel}), h("small", {textContent: tekst})));
    lijst.append(li);
  };
  const vers = () => "t=" + Date.now(), geen = {cache: "no-store"};
  const app = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  rij(location.protocol === "https:" || location.hostname === "localhost", "Veilige verbinding (https)", location.href);
  rij(null, app ? "Je opent dit als app" : "Je opent dit in een browservenster, niet als app", app ? "Beginscherm of Dock." : "Staat de app op je beginscherm? Dan ben je nu niet in die app.");
  let hrefs = [];
  try { // wat staat er in de pagina op de website?
    const t = await (await fetch("index.html?" + vers(), geen)).text(), links = [...t.matchAll(/<link[^>]+rel="(apple-touch-icon|icon|manifest)"[^>]*>/g)];
    for (const m of links) { const x = (m[0].match(/href="([^"]+)"/) || [])[1]; if (x) hrefs.push(x); }
    const heeft = n => links.some(m => m[1] === n);
    rij(heeft("apple-touch-icon"), "Regel apple-touch-icon in de pagina", heeft("apple-touch-icon") ? "Gevonden." : "Ontbreekt! Zonder deze regel maakt de iPhone een letter T.");
    rij(heeft("manifest"), "Regel manifest in de pagina", heeft("manifest") ? "Gevonden." : "Ontbreekt.");
    for (const m of links) { // iconen die in de pagina zelf zitten (data-URI): geen los bestand nodig
      const x = (m[0].match(/href="([^"]+)"/) || [])[1]; if (!x || !x.startsWith("data:")) continue;
      const afm = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i.naturalWidth + "×" + i.naturalHeight); i.onerror = () => ok(null); i.src = x; });
      rij(!!afm, `Icoon zit in de pagina zelf (${m[1]})`, afm ? `${afm} pixels, ${Math.round(x.length / 1365)} KB. Geen los bestand nodig.` : "Het ingebouwde icoon kan niet gelezen worden.", afm ? x : null);
    }
  } catch (e) { rij(false, "index.html niet te lezen", e.message); }
  try { // manifest
    const mUrl = new URL("manifest.webmanifest", location.href).href, r = await fetch(mUrl + "?" + vers(), geen);
    rij(r.ok, `Manifest (${r.status})`, mUrl);
    if (r.ok) {
      const m = await r.json(), start = new URL(m.start_url || ".", mUrl).href, scope = new URL(m.scope || ".", mUrl).href;
      rij(start.startsWith(scope) && new URL(start).origin === location.origin, "Startadres en bereik kloppen", `start_url ${start} | scope ${scope} | display ${m.display}`);
    }
  } catch (e) { rij(false, "Manifest lezen mislukt", e.message); }
  for (const f of [...new Set(["icon-180.png", "icon-192.png", "icon-512.png", "manifest.webmanifest", "sw.js", ...hrefs.filter(x => !x.startsWith("data:")).map(x => x.split("?")[0])])]) { // bestaan de bestanden?
    try {
      const r = await fetch(f + "?" + vers(), geen), ct = r.headers.get("content-type") || "", b = await r.blob();
      rij(r.ok, f, r.ok ? `Gevonden (${Math.round(b.size / 102.4) / 10} KB, ${ct || "onbekend type"}).` : `NIET GEVONDEN (fout ${r.status}). Dit bestand staat niet in de map op GitHub.`, r.ok && /\.png$/.test(f) && /image/.test(ct) ? URL.createObjectURL(b) : null);
    } catch (e) { rij(false, f, "Geen verbinding: " + e.message); }
  }
  if ("serviceWorker" in navigator) { // offline-cache
    const regs = await navigator.serviceWorker.getRegistrations();
    rij(regs.length ? true : null, regs.length ? `${regs.length} service worker actief` : "Geen service worker actief", regs.map(x => x.scope + (x.active ? " (actief)" : " (nog niet actief)")).join(" ") || "Er is nog geen offline-cache.");
    for (const naam of await caches.keys()) {
      const c = await caches.open(naam), slecht = []; let n = 0;
      for (const k of await c.keys()) { n++; const r = await c.match(k); if (r && !r.ok) slecht.push(new URL(k.url).pathname.split("/").pop() + " (" + r.status + ")"); }
      rij(!slecht.length, `Cache ${naam}: ${n} bestanden`, slecht.length ? "Bevat mislukte antwoorden: " + slecht.join(", ") + ". Tik op Wis de app-cache." : "Alles in de cache is in orde.");
    }
  }
  dd("samen").className = "d-samen " + (fouten ? "slecht" : "goed");
  dd("samen").textContent = fouten ? `Er ${fouten === 1 ? "is 1 probleem" : "zijn " + fouten + " problemen"} gevonden. Zie de rode regels.` : "Alles staat goed. Staat het oude icoon er nog? Verwijder de app van je beginscherm en voeg hem opnieuw toe.";
}
dd("app").onclick = dControleer;
dd("wis").onclick = async () => {
  for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  for (const n of await caches.keys()) await caches.delete(n);
  dd("samen").className = "d-samen goed"; dd("samen").textContent = "Cache gewist. Sluit de app, open hem opnieuw en voeg hem daarna opnieuw toe aan je beginscherm.";
};


</script></body></html>
