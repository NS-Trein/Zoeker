<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Icoontest Treinplek</title>
<link rel="icon" type="image/png" href="icon-diagnose.png"><link rel="apple-touch-icon" href="icon-diagnose.png">
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:16px 16px 48px;font:16px/1.45 system-ui,-apple-system,sans-serif;background:#e8edf3;color:#10213a}
h1{margin:4px 0 6px} h2{margin:22px 0 8px;font-size:18px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;border-left:6px solid #aaa}
li.ok{border-color:#1e8a3c} li.fout{border-color:#c62828}
li img{width:44px;height:44px;border-radius:10px;background:#dde3ec;flex:none}
li b{display:block} li small{color:#4b5b75}
button{display:block;width:100%;margin-top:10px;min-height:52px;border:0;border-radius:14px;background:#0b3b8c;color:#fff;font:700 17px system-ui}
button.rood{background:#c62828}
#samenvatting{margin:12px 0;padding:12px;border-radius:14px;font-weight:700}
.goed{background:#e3f4e7;color:#1e6b34}.slecht{background:#fdecec;color:#9b1c1c}
</style></head><body>
<h1>Icoontest</h1>
<p>Deze pagina laat zien waarom je app-icoon wel of niet werkt. Maak een schermafdruk van het resultaat en stuur hem naar Claude.</p>
<div id="samenvatting">Bezig met testen…</div>
<h2>1. Wat staat er in je pagina?</h2><ul id="pagina"></ul>
<h2>2. Staan de bestanden op je website?</h2><ul id="bestanden"></ul>
<h2>3. Wat onthoudt de app in zijn cache?</h2><ul id="cache"></ul>
<button class="rood" id="wis">Wis de app-cache en begin schoon</button>
<script>
const $ = id => document.getElementById(id);
const rij = (lijst, ok, titel, tekst, img) => {
  const li = document.createElement("li"); li.className = ok ? "ok" : "fout";
  if (img) { const i = document.createElement("img"); i.src = img; i.alt = ""; li.append(i); }
  const d = document.createElement("div"), b = document.createElement("b"), s = document.createElement("small");
  b.textContent = (ok ? "✅ " : "❌ ") + titel; s.textContent = tekst; d.append(b, s); li.append(d); $(lijst).append(li); return ok;
};
const BESTANDEN = ["icon-180.png", "icon-192.png", "icon-512.png", "manifest.webmanifest", "sw.js"];
async function test() {
  let fouten = 0; const check = (ok) => { if (!ok) fouten++; };
  // 1. de link-regels in index.html
  let hrefs = [];
  try {
    const t = await (await fetch("index.html?t=" + Date.now(), { cache: "no-store" })).text();
    const links = [...t.matchAll(/<link[^>]+rel="(apple-touch-icon|icon|manifest)"[^>]*>/g)];
    for (const m of links) { const h = (m[0].match(/href="([^"]+)"/) || [])[1]; if (h) hrefs.push(h); }
    check(rij("pagina", links.some(m => m[1] === "apple-touch-icon"), "apple-touch-icon-regel in index.html", links.some(m => m[1] === "apple-touch-icon") ? "Gevonden." : "Ontbreekt! Zonder deze regel maakt de iPhone een letter T."));
    check(rij("pagina", links.some(m => m[1] === "manifest"), "manifest-regel in index.html", links.some(m => m[1] === "manifest") ? "Gevonden." : "Ontbreekt."));
    const v = (t.match(/trein-v\d+/) || [])[0]; rij("pagina", true, "Versie van de pagina", "Staat online: index.html (zie logboek VERSIES.md voor het nummer)." + (v ? " Cache-naam: " + v : ""));
  } catch (e) { check(rij("pagina", false, "index.html niet te lezen", e.message)); }
  // 2. bestaan de bestanden echt?
  const lijst = [...new Set([...BESTANDEN, ...hrefs])];
  for (const f of lijst) {
    try {
      const r = await fetch(f + (f.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      const ct = r.headers.get("content-type") || "", blob = await r.blob();
      const isPng = /\.png/.test(f) && r.ok && /image/.test(ct);
      check(rij("bestanden", r.ok, f, r.ok ? `Gevonden (${Math.round(blob.size / 1024 * 10) / 10} KB, ${ct || "onbekend type"}).` : `NIET GEVONDEN (fout ${r.status}). Dit bestand staat niet in de map Zoeker op GitHub.`, isPng ? URL.createObjectURL(blob) : null));
    } catch (e) { check(rij("bestanden", false, f, "Geen verbinding: " + e.message)); }
  }
  // 3. service worker en cache
  if (!("serviceWorker" in navigator)) rij("cache", true, "Geen service worker", "Deze browser gebruikt er geen.");
  else {
    const regs = await navigator.serviceWorker.getRegistrations();
    rij("cache", true, regs.length ? `${regs.length} service worker actief` : "Geen service worker actief", regs.map(r => r.scope + (r.active ? " (actief)" : "")).join(" ") || "Er is nog geen offline-cache.");
    for (const naam of await caches.keys()) {
      const c = await caches.open(naam); let slecht = [];
      for (const k of await c.keys()) { const r = await c.match(k); if (r && !r.ok) slecht.push(new URL(k.url).pathname.split("/").pop() + " (" + r.status + ")"); }
      const n = (await c.keys()).length;
      check(rij("cache", !slecht.length, `Cache ${naam}: ${n} bestanden`, slecht.length ? "Bevat mislukte antwoorden: " + slecht.join(", ") + ". Tik hieronder op Wis de app-cache." : "Alles in de cache is in orde."));
    }
  }
  const s = $("samenvatting");
  s.className = fouten ? "slecht" : "goed";
  s.textContent = fouten ? `Er ${fouten === 1 ? "is 1 probleem" : "zijn " + fouten + " problemen"} gevonden. Zie de rode regels.` : "Alles staat goed op je website. Zet de app opnieuw op je beginscherm (en wis eventueel de cache hieronder).";
}
$("wis").onclick = async () => {
  for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  for (const n of await caches.keys()) await caches.delete(n);
  $("samenvatting").className = "goed"; $("samenvatting").textContent = "Cache gewist. Sluit nu deze pagina, open de app opnieuw en zet hem daarna opnieuw op je beginscherm.";
};
test();
</script></body></html>
