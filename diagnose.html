<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Treinplek diagnose</title>
<link rel="icon" type="image/png" href="icon-diagnose.png?v=24"><link rel="apple-touch-icon" href="icon-diagnose.png?v=24">
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;padding:16px 16px 48px;font:16px/1.45 system-ui,-apple-system,sans-serif;background:#e8edf3;color:#10213a}
h1{margin:4px 0 8px} label{display:block;margin:14px 0 4px;font-weight:600}
input{width:100%;font:inherit;font-size:17px;min-height:50px;padding:10px;border:2px solid #c4cdda;border-radius:14px}
button{display:block;width:100%;margin-top:10px;min-height:52px;border:0;border-radius:14px;background:#0b3b8c;color:#fff;font:700 17px system-ui}
button.licht{background:#fff;color:#0b3b8c;border:2px solid #0b3b8c}
pre{white-space:pre-wrap;word-break:break-word;background:#fff;border-radius:14px;padding:12px;font-size:12.5px;max-height:55vh;overflow:auto}
.ok{color:#1e6b34;font-weight:700}.fout{color:#9b1c1c;font-weight:700}
</style></head><body>
<h1>Diagnose</h1>
<p>Test of je Worker en je NS-sleutel werken. Tik op een knop en kijk wat NS terugstuurt. Met "Kopieer" kun je het resultaat naar Claude sturen.</p>
<label for="w">Worker-URL</label>
<input id="w" placeholder="https://treinplek.jouwnaam.workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false">
<button id="b1">1. Treinen bij mij in de buurt</button>
<label for="nr">Treinnummer (voor knop 2 en 3)</label>
<input id="nr" inputmode="numeric" placeholder="bijv. 2150">
<button id="b2">2. Haltes van deze rit</button>
<button id="b3">3. Samenstelling van deze trein</button>
<label for="st">Stationscode (voor knop 4)</label>
<input id="st" value="UT" autocapitalize="characters" spellcheck="false">
<button id="b4">4. Vertrektijden van dit station</button>
<button class="licht" id="b5">5. Ruwe treinlijst van NS (zonder gegevens)</button>
<button class="licht" id="b8">8. Web-app controle (manifest, iconen, service worker)</button>
<button class="licht" id="b7">7. Plaatje van NS ophalen (ddz_6.png)</button>
<button class="licht" id="b6">6. Ruwe treinlijst met mijn plek (20 km)</button>
<h2>Resultaat</h2>
<div id="status"></div>
<pre id="uit">Nog niets getest.</pre>
<div id="plaat"></div>
<button class="licht" id="kopieer">Kopieer resultaat</button>
<script>
const $ = id => document.getElementById(id);
const UITLEG = {
  200: "Gelukt. De Worker en NS werken.",
  401: "NS weigert je sleutel (401). Controleer NS_KEY in Cloudflare en of je op het product Ns-App bent geabonneerd.",
  403: "De Worker weigert deze website (403). Pas TOEGESTAAN bovenin de Worker aan naar het adres van je website.",
  404: "NS kent dit pad niet (404). Kopieer het resultaat en stuur het naar Claude, dan pas ik het pad aan.",
  429: "Te veel aanvragen (429). Wacht even en probeer opnieuw.",
  500.1: "De Worker mist je NS-sleutel. Zet NS_KEY als Secret in Cloudflare (Settings, Variables and Secrets) en klik op Deploy.",
  500: "NS gaf een interne fout (500). Meestal klopt het pad of een parameter niet. Onder het resultaat staat welke NS-paden de Worker probeerde. Kopieer het resultaat en stuur het naar Claude."
};
try { $("w").value = localStorage.getItem("diag-w") || ""; } catch (_) {}
fetch("index.html").then(r => r.text()).then(t => { const m = t.match(/const WORKER_URL = "([^"]*)"/); if (m && m[1]) $("w").value = m[1]; }).catch(() => {});
function toon(code, tekst) {
  $("status").className = code === 200 ? "ok" : "fout";
  $("status").textContent = code === null ? "" : (UITLEG[code] || (code === 0 ? "Geen verbinding met de Worker." : `NS of de Worker gaf fout ${code}.`));
  $("uit").textContent = tekst;
}
async function test(naam, pad) {
  const w = $("w").value.trim().replace(/\/+$/, "");
  if (!w) return toon(0, "Vul eerst de Worker-URL in.");
  try { localStorage.setItem("diag-w", w); } catch (_) {}
  $("status").textContent = ""; $("uit").textContent = "Bezig…";
  try {
    const t0 = performance.now(), r = await fetch(w + pad), tekst = await r.text();
    let net = tekst; try { net = JSON.stringify(JSON.parse(tekst), null, 2); } catch (_) {}
    const nsPad = r.headers.get("x-ns-pad");
    toon(/NS_KEY ontbreekt/.test(tekst) ? 500.1 : r.status, `${naam}\n${pad}\n${r.status} ${r.statusText} (${Math.round(performance.now() - t0)} ms)\n` + (nsPad ? `NS-pad dat werkte: ${nsPad}\n` : "") + "\n" + net.slice(0, 6000) + (net.length > 6000 ? "\n…(ingekort)" : ""));
  } catch (e) { toon(0, `${naam}\n${pad}\nGeen verbinding: ${e.message}\nControleer de Worker-URL (zonder / aan het eind) en TOEGESTAAN in de Worker.`); }
}
$("b1").onclick = () => {
  const gebruik = (lat, lng, noot) => test("Treinen in de buurt" + noot, `/nabij?lat=${lat.toFixed(5)}&lng=${lng.toFixed(5)}&radius=5000&limit=10`);
  if (!navigator.geolocation) return gebruik(52.0894, 5.1105, " (Utrecht, geen locatie beschikbaar)");
  navigator.geolocation.getCurrentPosition(p => gebruik(p.coords.latitude, p.coords.longitude, ""), () => gebruik(52.0894, 5.1105, " (Utrecht, locatie geweigerd)"), {timeout: 15000});
};
const nr = () => $("nr").value.replace(/\D/g, "");
$("b2").onclick = () => nr() ? test("Haltes van rit " + nr(), `/rit?nummer=${nr()}`) : toon(0, "Vul eerst een treinnummer in.");
$("b3").onclick = () => nr() ? test("Samenstelling van trein " + nr(), `/trein?nummer=${nr()}`) : toon(0, "Vul eerst een treinnummer in.");
$("b4").onclick = () => test("Vertrektijden " + $("st").value, `/vertrek?station=${encodeURIComponent($("st").value.trim().toUpperCase())}&maxJourneys=5`);
$("b7").onclick = async () => {
  const w = $("w").value.trim().replace(/\/+$/, ""); if (!w) return toon(0, "Vul eerst de Worker-URL in.");
  $("plaat").replaceChildren(); $("status").textContent = ""; $("uit").textContent = "Bezig…";
  try {
    const r = await fetch(`${w}/plaatje?url=${encodeURIComponent("https://vt.ns-mlab.nl/v1/images/ddz_6.png")}`);
    if (!r.ok) return toon(r.status, `Plaatje van NS\n/plaatje\n${r.status} ${r.statusText}\n\n${(await r.text()).slice(0, 600)}\n\nStaat in Cloudflare de nieuwste worker.js (v17 of hoger)? Deze versie laat ook vt.ns-mlab.nl toe.`);
    const blob = await r.blob(), u = URL.createObjectURL(blob), img = new Image();
    await new Promise((ok, fout) => { img.onload = ok; img.onerror = () => fout(new Error("Het antwoord is geen plaatje.")); img.src = u; });
    img.style.cssText = "max-width:100%;border:1px solid #c4cedb;border-radius:8px;background:#fff;margin-top:8px";
    $("plaat").append(img);
    toon(200, `Plaatje van NS\n/plaatje\n200 OK, ${blob.type}, ${Math.round(blob.size / 1024)} kB, ${img.naturalWidth} x ${img.naturalHeight} pixels\n(verwacht: 3215 x 108)`);
  } catch (e) { toon(0, `Plaatje van NS\n/plaatje\nGeen verbinding of geen plaatje: ${e.message}`); }
};
$("b8").onclick = async () => {
  const r = [], ok = (v, t) => r.push((v ? "OK  " : "FOUT ") + t), info = t => r.push("    " + t);
  $("plaat").replaceChildren(); $("status").textContent = ""; $("uit").textContent = "Bezig…";
  const app = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  info("Adres: " + location.href);
  ok(location.protocol === "https:", "Veilige verbinding (https)");
  info(app ? "Je opent dit nu ALS APP (beginscherm of Dock)." : "Je opent dit nu in een gewoon browservenster, niet als app.");
  try {
    const mUrl = new URL("manifest.webmanifest", location.href).href, res = await fetch(mUrl + "?t=" + Date.now(), {cache: "no-store"});
    ok(res.ok, `Manifest (${res.status}): ${mUrl}`);
    if (res.ok) {
      const m = await res.json(), start = new URL(m.start_url || ".", mUrl).href, scope = new URL(m.scope || ".", mUrl).href;
      info(`naam: ${m.name} | display: ${m.display}`);
      ok(start.startsWith(scope), `start_url ${start} ligt binnen scope ${scope}`);
      ok(new URL(start).origin === location.origin, "start_url staat op dezelfde site als deze pagina");
      for (const ic of m.icons || []) { const u = new URL(ic.src, mUrl).href, x = await fetch(u, {cache: "no-store"}); ok(x.ok, `Icoon ${ic.sizes}: ${x.status} ${ic.src}`); }
    }
    const t = await fetch(new URL("icon-180.png", location.href).href, {cache: "no-store"}); ok(t.ok, `Beginschermicoon icon-180.png: ${t.status}`);
  } catch (e) { ok(false, "Manifest of icoon lezen mislukt: " + e.message); }
  if ("serviceWorker" in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    ok(regs.length > 0, "Service worker: " + (regs.map(x => x.scope + (x.active ? " (actief)" : " (nog niet actief)")).join(", ") || "geen"));
    info("Caches: " + ((await caches.keys()).join(", ") || "geen"));
  } else ok(false, "Dit toestel kent geen service worker");
  r.push("", "Staat de app al lang op je beginscherm, dus van vóór de nieuwe website? Dan opent hij nog de OUDE site. Verwijder hem en voeg hem opnieuw toe vanaf het nieuwe adres.");
  toon(200, "Web-app controle\n" + r.join("\n"));
};
if (/[?&]app\b/.test(location.search)) setTimeout(() => $("b8").click(), 300);
$("b5").onclick = () => test("Ruwe treinlijst van NS", "/ruw");
$("b6").onclick = () => {
  const gebruik = (lat, lng, noot) => test("Ruwe treinlijst met plek" + noot, `/ruw?lat=${lat.toFixed(5)}&lng=${lng.toFixed(5)}&radius=20000&limit=50`);
  if (!navigator.geolocation) return gebruik(52.0894, 5.1105, " (Utrecht)");
  navigator.geolocation.getCurrentPosition(p => gebruik(p.coords.latitude, p.coords.longitude, ""), () => gebruik(52.0894, 5.1105, " (Utrecht, locatie geweigerd)"), {timeout: 15000});
};
$("kopieer").onclick = async () => { try { await navigator.clipboard.writeText($("uit").textContent); $("kopieer").textContent = "Gekopieerd"; setTimeout(() => $("kopieer").textContent = "Kopieer resultaat", 1500); } catch (_) { alert("Selecteer de tekst en kopieer hem zelf."); } };
</script></body></html>
